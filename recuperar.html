<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | LOGIS-TECH</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor-centro">
        <div class="tarjeta-auth">
            <div class="logo-titulo">
                <div class="logo-icono">🗄️</div>
                <span style="font-size: 22px; font-weight: bold; color: #6A0DAD;">LOGIS-TECH</span>
            </div>
            <h2>Recuperar Contraseña</h2>
            <p style="color:#666; margin-bottom:25px;">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
            <form>
                <div class="grupo-input">
                    <label>Correo Electrónico</label>
                    <input type="email" required>
                </div>
                <button type="button" class="btn btn-verde">Enviar Enlace</button>
            </form>
            <div class="enlaces">
                <a href="login.html">← Volver al inicio de sesión</a>
            </div>
        </div>
    </div>
</body>
</html>
