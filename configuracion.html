<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración | LOGIS-TECH</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">LOGIS-TECH</div>
            <a href="dashboard.html">🏠 Inicio</a>
            <a href="perfil.html">👤 Perfil</a>
            <a href="configuracion.html" class="activo">⚙️ Ajustes</a>
            <a href="login.html" style="color:var(--rojo-suave);">🚪 Cerrar sesión</a>
        </aside>

        <main class="contenido-principal">
            <h1>Configuración del Sistema</h1>
            <div class="tabla-contenedor">
                <h3>Configuración General</h3>
                <form>
                    <div class="grupo-input">
                        <label>Nombre de la Empresa</label>
                        <input type="text" value="LOGIS-TECH">
                    </div>
                    <div class="grupo-input">
                        <label>Moneda Principal</label>
                        <select>
                            <option selected>COP - Peso Colombiano</option>
                            <option>USD - Dólar</option>
                            <option>EUR - Euro</option>
                        </select>
                    </div>
                    <div class="grupo-input">
                        <label>Zona Horaria</label>
                        <select>
                            <option selected>UTC-5 (Colombia)</option>
                            <option>UTC-4</option>
                        </select>
                    </div>
                    <hr>
                    <h3>Notificaciones</h3>
                    <div class="checkbox-grupo">
                        <input type="checkbox" id="notif1" checked>
                        <label for="notif1">Notificaciones por correo</label>
                    </div>
                    <div class="checkbox-grupo">
                        <input type="checkbox" id="notif2" checked>
                        <label for="notif2">Alertas de stock bajo</label>
                    </div>
                    <div class="checkbox-grupo">
                        <input type="checkbox" id="notif3">
                        <label for="notif3">Resumen diario</label>
                    </div>
                    <button type="button" class="btn btn-verde">Guardar Cambios</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
